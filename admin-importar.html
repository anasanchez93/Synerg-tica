<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Importar alimentos</title>
<style>:root{color-scheme:dark light}body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px 16px 40px;background:#0f1115;color:#eee}
@media(prefers-color-scheme:light){body{background:#fff;color:#111}}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #888;width:100%;box-sizing:border-box;margin:6px 0 12px;background:transparent;color:inherit}
button{background:#a3e635;color:#111;border:0;font-weight:700}button:disabled{opacity:.5}
pre{background:#0004;padding:12px;border-radius:10px;white-space:pre-wrap;min-height:120px;font-size:13px}label{font-size:13px;opacity:.8}</style></head><body>
<h1>Importar alimentos</h1>
<p>Trae productos de Open Food Facts a tu base de datos. Deja la pantalla encendida y esta página abierta mientras trabaja (puede tardar bastante la primera vez). Se puede repetir cuando quieras: no duplica.</p>
<label>Dirección de la función</label><input id="u" value="https://xdrjltzsglascuhptpyl.supabase.co/functions/v1/importar-alimentos">
<label>Clave de importación (IMPORT_SECRET)</label><input id="s" type="password" autocomplete="off">
<label>Supermercado</label><select id="t" style="width:100%;padding:12px;margin:6px 0 12px;border-radius:10px"><option value="todos">Todos</option><option>mercadona</option><option>dia</option><option>aldi</option><option>consum</option><option>carrefour</option></select>
<button id="go" onclick="run()">Empezar importación</button><pre id="log">Listo.</pre>
<script>
const L=m=>{log.textContent+='\n'+m;log.scrollTop=1e9};let stop=false;
async function run(){go.disabled=true;log.textContent='';const T=t.value==='todos'?['mercadona','dia','aldi','consum','carrefour']:[t.value];let tot=0;
 for(const tienda of T){let page=1,tries=0;L('▶ '+tienda);
  while(true){try{const r=await fetch(u.value,{method:'POST',headers:{'Content-Type':'application/json','x-import-secret':s.value},body:JSON.stringify({tienda,page,pages:12})});const j=await r.json();
   if(r.status===401){L('❌ Clave incorrecta');go.disabled=false;return}
   if(j.error){L('⚠ '+j.error);if(++tries>3){L('Paso al siguiente');break}await new Promise(x=>setTimeout(x,10000));if(j.nextPage)page=j.nextPage;continue}
   tries=0;tot+=j.imported;L(`  ${tienda}: revisados ${j.scanned}, guardados ${j.imported} (total ${tot})`);if(j.done)break;page=j.nextPage}
   catch(e){L('⚠ '+e.message);if(++tries>3)break;await new Promise(x=>setTimeout(x,10000))}}
 }
 L('✅ Terminado. Guardados: '+tot);go.disabled=false}
</script></body></html>
