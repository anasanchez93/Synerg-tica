async function cHash(){const h=location.hash;if(h.length<2)return;const q=new URLSearchParams(h.slice(1));if(q.get('error')){history.replaceState(null,'',RU());tab='comunidad';render();alert('El enlace ha caducado o ya se usó. Pide otro desde Comunidad.');return}const t=q.get('access_token');if(!t)return;history.replaceState(null,'',RU());try{const u=await(await fetch(SB+'/auth/v1/user',{headers:{apikey:SK,Authorization:'Bearer '+t}})).json();setSess({access_token:t,refresh_token:q.get('refresh_token'),expires_in:+q.get('expires_in')||3600,user:u});cm.ld=0;tab='hoy';await afterLogin();if(q.get('type')==='recovery')openPw();else alert('✓ Cuenta confirmada. ¡Te damos la bienvenida!')}catch(e){alert('No se pudo completar el enlace')}}
async function cOut(){try{await push()}catch(e){if(!confirm('No se han podido subir tus últimos cambios (sin conexión). Si sales ahora podrías perderlos. ¿Salir igualmente?'))return}try{await fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+SS.tk}})}catch(e){}try{localStorage.removeItem(K)}catch(e){}S=init();cOutL();render()}
async function cDelAcc(){if(!confirm('¿Eliminar tu cuenta y todo lo que has publicado? No se puede deshacer.'))return;try{await delAllImg();await sb('rpc/delete_my_account',{m:'POST',b:{}});try{localStorage.removeItem(K)}catch(e){}S=init();cOutL();render();alert('Cuenta eliminada')}catch(e){alert(tr(e.message))}}
async function cLoad(){try{const[b,r,l]=await Promise.all([sb('blocks?select=blocked_id'),sb('shared_recipes?select=*,profiles!shared_recipes_user_id_fkey(display_name),recipe_likes(count)&order=created_at.desc&limit=50'),sb('recipe_likes?select=recipe_id&user_id=eq.'+SS.uid)]);cm.bl=new Set(b.map(x=>x.blocked_id));cm.recs=r.filter(x=>!cm.bl.has(x.user_id));cm.lk=new Set(l.map(x=>x.recipe_id));cm.e='';await cPoll(1)}catch(x){cm.e=tr(x.message)}if(tab==='comunidad')render()}
async function cPoll(q){try{let r;try{r=await sb('chat_messages?select=id,user_id,body,image_path,created_at,profiles(display_name)&order=created_at.desc&limit=60')}catch(e2){r=await sb('chat_messages?select=id,user_id,body,created_at,profiles(display_name)&order=created_at.desc&limit=60')}const n=r.filter(x=>!cm.bl.has(x.user_id)).reverse();if(JSON.stringify(n.map(x=>x.id))!==JSON.stringify(cm.msgs.map(x=>x.id))){cm.msgs=n;cPaint()}}catch(x){if(!q)cm.e=tr(x.message)}}
function cPaint(){const el=document.getElementById('cmsg');if(el){el.innerHTML=msgsH();el.scrollTop=el.scrollHeight}}
setInterval(()=>{if(tab==='comunidad'&&SS&&cm.sub==='chat')cPoll(1)},6000);
function msgsH(){return cm.msgs.length?cm.msgs.map(x=>{const me=x.user_id===SS.uid;return`<div class="mb ${me?'me':''}"><small>${esc(x.profiles?.display_name||'Persona')} · ${fdt(x.created_at).slice(-5)}</small>${x.body==='📷'&&x.image_path?'':esc(x.body)}${imT(x.image_path)}<div style="margin-top:2px">${me?`<button onclick="cDel('chat_messages',${x.id})">🗑</button>`:`<button onclick="cRep('message',${x.id})">⚑ Reportar</button><button onclick="cBlock('${esc(x.user_id)}')">🚫 Bloquear</button>`}</div></div>`}).join(''):'<div class="empty">Aún no hay mensajes. ¡Escribe el primero!</div>'}
function recH(r){const me=r.user_id===SS.uid,n=r.recipe_likes&&r.recipe_likes[0]?r.recipe_likes[0].count:0,mc=r.kcal!=null?`<small style="color:var(--lime)">${r.kcal} kcal · P ${r.protein??'-'} G ${r.fat??'-'} C ${r.carbs??'-'}</small>`:'';
return`<div class="card"><div class="mh"><b style="text-transform:none">${esc(r.title)}</b><span>${esc(r.meal||'')}</span></div><small style="color:var(--mu);display:block">${esc(r.profiles?.display_name||'Persona')} · ${fdt(r.created_at)}</small>${imT(r.image_path)}${mc}<details class="dd"><summary><span>Ver receta</span></summary><b style="font-size:12px">Ingredientes</b><p class="empty" style="font-style:normal;white-space:pre-line">${esc(r.ingredients)}</p>${r.steps?`<b style="font-size:12px">Elaboración</b><p class="empty" style="font-style:normal;white-space:pre-line">${esc(r.steps)}</p>`:''}</details><div class="row" style="margin-top:10px"><button class="btn ${cm.lk.has(r.id)?'':'g'}" onclick="cLike(${r.id})">❤️ ${n}</button><button class="btn g" onclick="cSave(${r.id})">➕ Guardar</button>${me?`<button class="btn g" onclick="cDel('shared_recipes',${r.id})">🗑 Borrar</button>`:`<button class="btn g" onclick="cRep('recipe',${r.id})">⚑ Reportar</button><button class="btn g" onclick="cBlock('${esc(r.user_id)}')">🚫</button>`}</div></div>`}
function comunidad(){if(!SS)return authH();
if(!cm.ld){cm.ld=1;cLoad()}
let h=`<div class="card"><div class="mh"><b style="text-transform:none">👥 ${esc(SS.name)}</b><button class="btn g" style="padding:6px 12px" onclick="cOut()">Salir</button></div><div class="chips"><button class="chip ${cm.sub==='rec'?'on':''}" onclick="cm.sub='rec';render()">🥗 Recetas</button><button class="chip ${cm.sub==='chat'?'on':''}" onclick="cm.sub='chat';render()">💬 Chat</button></div>${cm.e?`<p class="empty" style="color:var(--rose);font-style:normal">${esc(cm.e)} <a href="#" onclick="cm.ld=0;cm.e='';render();return false">Reintentar</a></p>`:''}</div>`;
if(cm.sub==='rec')h+=`<button class="btn" style="width:100%;margin-bottom:14px" onclick="openShare()">+ Compartir una receta</button>`+(cm.recs.length?cm.recs.map(recH).join(''):'<div class="card"><div class="empty">Todavía no hay recetas compartidas. ¡Anímate a publicar la primera!</div></div>');
else{h+=`<div class="card"><div class="cmsg" id="cmsg">${msgsH()}</div><div class="row" style="margin-top:10px"><label class="btn g pbtn">📷<input type="file" accept="image/*" hidden onchange="cPhoto(this)"></label><input id="cin" maxlength="500" placeholder="Escribe un mensaje…" value="${esc(cm.draft)}" oninput="cm.draft=this.value" onkeydown="if(event.key==='Enter')cSend()"><button class="btn" style="flex:0 0 70px" onclick="cSend()">➤</button></div></div>`;setTimeout(cPaint,0)}
return h+`<p class="empty" style="text-align:center"><a href="#" onclick="openPw();return false" style="color:var(--mu)">Cambiar contraseña</a> · <a href="#" onclick="cDelAcc();return false" style="color:var(--mu)">Eliminar mi cuenta</a></p>`}

/* ===== Fotos ===== */
const IMB=SB+'/storage/v1/object/public/fotos/';
function imgU(p){return IMB+encodeURI(p)}
function shrink(f,max=1000,q=.72){return new Promise((ok,ko)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('Imagen no válida')),'image/jpeg',q)};i.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('No se pudo leer la imagen'))};i.src=u})}
async function upImg(f){if(!SS||SS.uid==='demo')throw new Error('Inicia sesión para subir fotos');const b=await shrink(f),p=SS.uid+'/'+Date.now()+'.jpg',r=await fetch(SB+'/storage/v1/object/fotos/'+p,{method:'POST',headers:{apikey:SK,Authorization:'Bearer '+await sbTok(),'Content-Type':'image/jpeg'},body:b});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||j.error||'No se pudo subir la foto ('+r.status+'). ¿Has ejecutado supabase_fotos.sql?')}return p}
function delImg(p){if(!p)return;sbTok().then(t=>fetch(SB+'/storage/v1/object/fotos/'+encodeURI(p),{method:'DELETE',headers:{apikey:SK,Authorization:'Bearer '+t}})).catch(()=>{})}
async function delAllImg(){try{const t=await sbTok(),h={apikey:SK,Authorization:'Bearer '+t,'Content-Type':'application/json'},l=await(await fetch(SB+'/storage/v1/object/list/fotos',{method:'POST',headers:h,body:JSON.stringify({prefix:SS.uid,limit:1000})})).json();if(Array.isArray(l)&&l.length)await fetch(SB+'/storage/v1/object/fotos',{method:'DELETE',headers:h,body:JSON.stringify({prefixes:l.map(o=>SS.uid+'/'+o.name)})})}catch(e){}}
function showImg(u){md.innerHTML=`<div class="modal" style="align-items:center" onclick="closeM()"><img src="${esc(u)}" style="max-width:96vw;max-height:88vh;border-radius:14px"></div>`}
function imT(p,st){return p?`<img class="mi" ${st?`style="${st}" `:''}loading="lazy" src="${esc(imgU(p))}" onclick="showImg(this.src)">`:''}
async function cPhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;try{const p=await upImg(f),b=(cm.draft||'').trim()||'📷';cm.draft='';const i=document.getElementById('cin');if(i)i.value='';await sb('chat_messages',{m:'POST',b:{body:b,image_path:p}});await cPoll(1)}catch(e){alert(tr(e.message))}}
function rPh(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const r=S.r.find(x=>x.id===id),p=await upImg(f);delImg(r.im);r.im=p;save();render()}catch(e){alert(tr(e.message))}};i.click()}
let shIm='';
async function cSend(){const b=(cm.draft||'').trim();if(!b)return;cm.draft='';const i=document.getElementById('cin');if(i)i.value='';try{await sb('chat_messages',{m:'POST',b:{body:b}});await cPoll(1)}catch(e){alert(tr(e.message))}}
async function cLike(id){const l=cm.lk.has(id),r=cm.recs.find(x=>x.id===id);try{if(l){await sb('recipe_likes?recipe_id=eq.'+id+'&user_id=eq.'+SS.uid,{m:'DELETE'});cm.lk.delete(id)}else{await sb('recipe_likes',{m:'POST',b:{recipe_id:id}});cm.lk.add(id)}if(r){const c=r.recipe_likes&&r.recipe_likes[0]?r.recipe_likes[0].count:0;r.recipe_likes=[{count:Math.max(0,c+(l?-1:1))}]}render()}catch(e){alert(tr(e.message))}}
async function cDel(t,id){if(!confirm('¿Borrar?'))return;const row=(t==='chat_messages'?cm.msgs:cm.recs).find(x=>x.id===id);try{await sb(t+'?id=eq.'+id,{m:'DELETE'});if(row&&row.image_path)delImg(row.image_path);cm.ld=0;render()}catch(e){alert(tr(e.message))}}
async function cRep(k,id){const r=prompt('¿Por qué quieres reportarlo? (opcional)');if(r===null)return;try{await sb('reports',{m:'POST',b:{kind:k,target_id:id,reason:r.slice(0,300)}});alert('Gracias, lo revisaremos.')}catch(e){alert(tr(e.message))}}
async function cBlock(u){if(!confirm('¿Bloquear a esta persona? Dejarás de ver sus publicaciones.'))return;try{await sb('blocks',{m:'POST',b:{blocked_id:u}});cm.bl.add(u);cm.recs=cm.recs.filter(x=>x.user_id!==u);cm.msgs=cm.msgs.filter(x=>x.user_id!==u);render()}catch(e){alert(tr(e.message))}}
function openShare(){shIm='';const L=S.r.filter(r=>r.u===S.p);md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Compartir receta</h3><label>Rellenar desde una de mis recetas (opcional)</label><select id="sf0" onchange="shFill(this.value)"><option value="">—</option>${L.map(r=>`<option value="${r.id}">${esc(r.n)}</option>`).join('')}</select><label>Título</label><input id="sft" maxlength="80"><label>Foto (opcional)</label><input id="sfph" type="file" accept="image/*"><label>Comida</label><select id="sfm">${['desayuno','almuerzo','cena','snack','otro'].map(x=>`<option>${x}</option>`).join('')}</select><label>Ingredientes (uno por línea)</label><textarea id="sfi" maxlength="1500"></textarea><label>Elaboración</label><textarea id="sfs" maxlength="3000"></textarea><div class="row"><div><label>Kcal</label><input id="sfk" type="number"></div><div><label>Prot (g)</label><input id="sfp" type="number"></div></div><div class="row"><div><label>Grasa (g)</label><input id="sfg" type="number"></div><div><label>Carbs (g)</label><input id="sfc" type="number"></div></div><p class="empty">Comparte solo recetas tuyas o con permiso de su autora. No incluyas datos personales.</p><div class="row"><button class="btn g" onclick="closeM()">Cancelar</button><button class="btn" onclick="shSave()">Publicar</button></div></div></div>`}
function shFill(id){const r=S.r.find(x=>x.id==id);if(!r)return;shIm=r.im||'';sft.value=r.n;sfm.value=r.t;sfi.value=r.x.split('+').map(x=>x.trim()).join('\n');sfs.value=r.e||'';sfk.value=r.k;sfp.value=r.p;sfg.value=r.g;sfc.value=r.c}
async function shSave(){const t=sft.value.trim(),i=sfi.value.trim();if(t.length<3||i.length<3){alert('Pon un título y los ingredientes');return}const n=x=>x.value===''?null:Math.round(+x.value);try{let ip=null;const ff=sfph.files&&sfph.files[0];if(ff)ip=await upImg(ff);else if(shIm){try{ip=await upImg(await(await fetch(imgU(shIm))).blob())}catch(e3){}}const bd={title:t,meal:sfm.value,ingredients:i,steps:sfs.value.trim()||null,kcal:n(sfk),protein:n(sfp),fat:n(sfg),carbs:n(sfc)};if(ip)bd.image_path=ip;await sb('shared_recipes',{m:'POST',b:bd});closeM();cm.sub='rec';cm.ld=0;render()}catch(e){alert(tr(e.message))}}
let SYT='',pt=null;
function setSy(t){SYT=t;const e=document.getElementById('sy');if(e)e.textContent=t}
function schedPush(){if(!SS||SS.uid==='demo'||!S.uid)return;setSy('⏳');clearTimeout(pt);pt=setTimeout(()=>push().catch(()=>{}),4000)}
async function push(){if(!SS||SS.uid==='demo'||!S.uid)return;clearTimeout(pt);try{await sb('user_data?on_conflict=user_id',{m:'POST',b:{user_id:SS.uid,data:S,updated_at:new Date().toISOString()},pf:'resolution=merge-duplicates,return=minimal'});setSy('☁️ guardado')}catch(e){setSy('⚠️ sin conexión');pt=setTimeout(()=>push().catch(()=>{}),30000);throw e}}
function ensureP(){if(S.sx==null&&SS.sx){S.sx=SS.sx;if(S.cyc==null&&SS.sx!=='o')S.cyc=SS.sx==='f'}if(!S.p)S.p=(SS.name||'Yo').replace(/[|<>&"'`\\]/g,'').trim()||'Yo';S.g=S.g||{};if(!S.g[S.p])S.g[S.p]={k:2000,w:2500,p:150,g:65,c:250}}
function migrate(L,f,t){const n=init();n.p=t;n.g[t]=Object.assign({k:2000,w:2500,p:150,g:65,c:250},L.g&&L.g[f]);Object.keys(L.d||{}).forEach(k=>{if(k.startsWith(f+'|'))n.d[t+'|'+k.slice(f.length+1)]=L.d[k]});const mv=a=>(a||[]).filter(x=>x.u===f).map(x=>({...x,u:t}));n.r=mv(L.r);n.md=mv(L.md);n.lb=mv(L.lb);if(L.ro)n.ro=L.ro;n.ex=L.ex||[];n.fo=L.fo||[];n.st={[t]:(L.st||{})[f]||'ciclo'};n.pg={[t]:(L.pg||{})[f]||''};['th','ac','sc'].forEach(k=>{if(L[k]!=null)n[k]=L[k]});return n}

if(S.uid&&S.uid!==SS.uid)S=init();S.uid=SS.uid;let rem=null,ok=true;
try{const r=await sb('user_data?select=data&user_id=eq.'+SS.uid);rem=r&&r[0]?r[0].data:null}catch(e){ok=false;setSy('⚠️ sin conexión')}
if(rem&&rem.v===2&&(!S.p||(rem.ts||0)>(S.ts||0))){S=rem;S.uid=SS.uid}
ensureP();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
render();
if(!S.ob&&ok){if(LEG&&Object.keys(LEG.g||{}).length)showLeg();else showOb()}

function showLeg(){md.innerHTML=`<div class="modal"><div class="sheet"><h3>Datos de este móvil</h3><p class="empty" style="font-style:normal">He encontrado datos de la versión anterior de la app. ¿De quién son? Se importarán a tu cuenta.</p><div class="chips">${Object.keys(LEG.g).map(n=>`<button class="chip" data-n="${esc(n)}" onclick="impLeg(this.dataset.n)">${esc(n)}</button>`).join('')}</div><button class="btn g" style="width:100%;margin-top:14px" onclick="skipLeg()">No importar, empezar de cero</button></div></div>`}

function showOb(){const g=S.g[S.p];md.innerHTML=`<div class="modal"><div class="sheet"><h3>Te damos la bienvenida, ${esc(S.p)} 👋</h3><p class="empty" style="font-style:normal">Configura tus objetivos diarios. Podrás cambiarlos cuando quieras en Cuerpo.</p><div class="row"><div><label>Kcal</label><input id="obk" type="number" value="${g.k}"></div><div><label>Agua (ml)</label><input id="obw" type="number" value="${g.w}"></div></div><div class="row"><div><label>Prot (g)</label><input id="obp" type="number" value="${g.p}"></div><div><label>Grasa (g)</label><input id="obg" type="number" value="${g.g}"></div><div><label>Carbs (g)</label><input id="obc" type="number" value="${g.c}"></div></div>${S.sx==='f'||S.sx==='m'?'':'<label class="ck"><input type="checkbox" id="obx" checked>Quiero seguimiento del ciclo, embarazo o menopausia</label>'}<div class="row" style="margin-top:14px"><button class="btn g" onclick="obSave(1)">Omitir</button><button class="btn" onclick="obSave()">Guardar</button></div></div></div>`}

function accCard(){return`<div class="card"><h3>👤 Cuenta</h3><div class="pre"><span>Sesión</span><b>${esc(S.p)}</b></div><div class="pre"><span>Datos en la nube</span><b>${esc(SYT||'—')}</b></div><div class="row" style="margin-top:12px"><button class="btn g" onclick="push().then(()=>render()).catch(()=>alert('Sin conexión: se guardará cuando vuelvas a tener internet'))">☁️ Sincronizar</button><button class="btn g" onclick="cOut()">Salir</button></div><p class="empty"><a href="#" onclick="openPw();return false" style="color:var(--mu)">Cambiar contraseña</a> · <a href="#" onclick="cDelAcc();return false" style="color:var(--mu)">Eliminar mi cuenta</a></p></div>`}

let HK;
