<style>

:root[data-theme="dark"]{--bg:#0e0f12;--card:#17181c;--card2:#22242a;--tx:#fff;--mu:#8a8e97;--ln:#2a2d34;--lime:#a3e635;--blue:#38bdf8;--amb:#eab308;--rose:#f43f5e;--org:#f97316}

body{margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}

.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid var(--ln)}

.nav div{max-width:460px;margin:0 auto;display:flex;background:var(--card);border:1px solid var(--ln);border-radius:30px;padding:8px;pointer-events:auto;box-shadow:0 8px 30px #0005}

.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}

.pre{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--mu)}.pre b{color:var(--tx)}
.empty{color:var(--mu);font-size:13px;font-style:italic;margin:6px 0}
.tb{width:100%;border-collapse:collapse;font-size:11px}.tb th,.tb td{border:1px solid var(--ln);padding:5px 6px;text-align:left;vertical-align:top}.tb th{background:var(--card2);font-size:10px;text-transform:uppercase}.tb tr.tt td{font-weight:800;background:var(--card2)}.ow{overflow-x:auto;margin:10px 0}
@media print{body>*:not(#md){display:none!important}.modal{position:static!important;background:none!important}.sheet{max-width:none!important;max-height:none!important;box-shadow:none;background:#fff!important;color:#000!important}.noprint{display:none!important}.tb th,.tb td{border-color:#999!important;color:#000!important}.tb th,.tb tr.tt td{background:#eee!important}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand img{width:38px;height:38px;border-radius:10px}.brand b{font-size:19px;font-weight:800;letter-spacing:-.3px}
.ck{display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--tx);letter-spacing:0;margin:0;padding:7px 0;font-weight:500}.ck input{width:18px;height:18px;margin:0;accent-color:var(--lime)}.chips{flex-wrap:wrap}

:root{--on:#fff;--sh:0 8px 28px #1b1f2a14}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--on:#111;--sh:0 8px 28px #0007}}:root[data-theme="dark"]{--on:#111;--sh:0 8px 28px #0007}

.brand .ib{margin-left:auto}.hi{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px}

.dd{border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-top:10px;background:var(--card2)}.dd summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}.dd summary::-webkit-details-marker{display:none}.dd summary>span:first-child{flex:1;min-width:0}.dd summary::after{content:'▾';color:var(--mu)}.dd[open] summary::after{content:'▴'}.dd small{display:block;color:var(--mu);font-weight:500;font-size:11px;margin-top:2px}
.cal button.gs{background:color-mix(in srgb,var(--lime) 18%,transparent)}.cal button.fur{background:var(--lime);color:var(--on)}.cal button small{display:block;font-size:8px;line-height:1;opacity:.8}
.nav{z-index:5}.nav #nv{position:relative;display:flex;justify-content:center;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;max-width:460px;margin:0 auto;pointer-events:none}
.nav .nvb{flex:none;display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:30px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--ln);color:var(--tx);font-size:14px;font-weight:800;pointer-events:auto;box-shadow:var(--sh);position:relative;z-index:2;cursor:pointer}.nav .nvb span{display:inline;font-size:20px;opacity:1}.nav .nvb i{font-style:normal;color:var(--mu);font-size:12px}
.nav .nvo{position:fixed;inset:0;max-width:none;margin:0;padding:0;border:0;border-radius:0;background:#0003;box-shadow:none;backdrop-filter:none;display:block;pointer-events:auto;z-index:1}
.nav .nvm{position:absolute;bottom:62px;left:0;right:0;z-index:2;max-width:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:24px;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);box-shadow:var(--sh);pointer-events:auto}
.nav .nvm button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px;border-radius:16px;font-size:12px;font-weight:700;color:var(--mu);cursor:pointer}.nav .nvm button.on{background:color-mix(in srgb,var(--lime) 22%,transparent);color:var(--tx)}.nav .nvm button span{font-size:26px;opacity:1;transform:none}
.cmsg{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px}.mb{max-width:88%;padding:8px 12px;border-radius:16px;background:var(--card2);font-size:14px;line-height:1.4;word-break:break-word}.mb.me{align-self:flex-end;background:color-mix(in srgb,var(--lime) 25%,transparent)}.mb small{display:block;color:var(--mu);font-size:10px;margin-bottom:2px}.mb button{background:none;border:0;color:var(--mu);font-size:11px;cursor:pointer;padding:0 6px 0 0}
textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;min-height:84px;resize:vertical}
</style></head><body>

<script>
const MEALS=['desayuno','almuerzo','cena','snack'];

const RG=[
['d','Avena al horno proteica (batch cooking)','Base común, 8 porciones (2 al día entre las dos): 240 g de copos de avena integrales, 4 huevos, 300 g de claras líquidas, 500 ml de leche de soja, 2 manzanas ralladas, 2 cucharaditas de levadura y canela. Bate la leche, los huevos y las claras; incorpora la avena, la levadura, la manzana y la canela. Vierte en un molde rectangular y hornea a 180 °C durante 30-35 min. Deja enfriar y corta en 8 porciones iguales. Cada día calienta 1 porción y añade el acompañamiento.','1 porción del molde (1/8) + 150g queso fresco batido 0% + 50g frutos rojos',430,34,11,50,'1 porción del molde (1/8) + 1 plátano mediano (120g) + 15g crema de cacahuete + 10g miel',590,28,18,80,3],
['a','Solomillo de cerdo magro con cuscús','Marca medallones de solomillo magro en sartén con ajo y pimientos. Sirve sobre cuscús hidratado con caldo de verduras hirviendo.','220g solomillo de cerdo + 40g cuscús (seco) + 10g AOVE',397,48,8,31,'140g solomillo de cerdo + 90g cuscús (seco) + 10g AOVE',478,30,10,65,2],
['a','Pavo especiado shawarma con pan pita','Saltea tiras de pavo con comino, pimentón, orégano, ajo y cebolla. Rellena los panes pita integrales tostados.','230g pechuga de pavo + 1 pan pita integral (40g) + ensalada libre',373,54,5,28,'140g pechuga de pavo + 3 panes pita integrales (120g) + ensalada libre',514,38,6,78,0],
['a','Pollo al estragón con patata asada','Hornea o sella la pechuga de pollo con estragón, vino blanco y ajo. Acompáñala con patata asada al horno o al microondas.','220g pechuga de pollo + 160g patata (cruda) + 10g AOVE',387,45,12,35,'130g pechuga de pollo + 320g patata (cruda) + 10g AOVE',402,30,10,65,0],
['a','Garbanzos salteados con pavo y espinacas','Rehoga dados de pavo con ajo, espinacas frescas y garbanzos cocidos en sartén. Los garbanzos secos equivalen a unos 110 g cocidos de bote (Ana) o 240 g (Elena).','220g pechuga de pavo + 50g garbanzos (secos)',425,58,6,32,'130g pechuga de pavo + 110g garbanzos (secos)',485,39,7,68,0],
['a','Pollo al limón con arroz Jasmine','Saltea la pechuga de pollo en wok con zumo de limón, jengibre y calabacín. Sirve con arroz Jasmine cocido.','220g pechuga de pollo + 40g arroz Jasmine (seco)',404,45,12,35,'130g pechuga de pollo + 85g arroz Jasmine (seco)',454,30,10,65,0],
['a','Salmón a la plancha con patata al horno','Sugerencia: cocina el salmón a la plancha unos 3-4 min por lado. Hornea la patata en rodajas a 200 °C unos 30 min con el AOVE.','220g salmón fresco + 150g patata (cruda) + 10g AOVE',663,44,32,30,'140g salmón fresco + 300g patata (cruda) + 10g AOVE',612,28,21,60,0],
['a','Revuelto de sepia y espárragos trigueros','Sugerencia: saltea la sepia en trozos con los espárragos trigueros, añade los huevos y las claras y revuelve hasta que cuajen. Sirve con el pan integral.','200g sepia limpia + 2 huevos + 100g claras + 30g pan integral',437,58,13,22,'120g sepia limpia + 2 huevos + 80g pan integral',442,40,13,42,0],
['a','Lomo de merluza con boniato y pimientos','Sugerencia: hornea el lomo de merluza sobre pimientos y el boniato en rodajas a 190 °C unos 20-25 min con el AOVE.','250g merluza fresca + 140g boniato (crudo) + 10g AOVE',415,42,11,37,'150g merluza fresca + 280g boniato (crudo) + 10g AOVE',454,26,11,63,0],
['a','Sepia a la plancha con arroz integral','Sugerencia: marca la sepia en plancha muy caliente con ajo y perejil. Sirve con el arroz integral cocido.','250g sepia limpia + 35g arroz integral (seco) + 10g AOVE',409,44,11,33,'150g sepia limpia + 80g arroz integral (seco) + 10g AOVE',488,28,11,68,0],
['a','Lubina a la espalda con patata panadera','Sugerencia: abre la lubina por la espalda y hornéala sobre la patata en rodajas finas con el AOVE a 200 °C unos 25 min.','250g lubina limpia + 150g patata (cruda) + 10g AOVE',447,48,13,30,'150g lubina limpia + 300g patata (cruda) + 10g AOVE',466,29,11,60,0],
['a','Hamburguesa casera de pollo/pavo','Sugerencia: mezcla la pechuga picada con ajo, perejil y especias, forma la hamburguesa y hazla a la plancha. Sirve en el pan con ensalada.','220g pechuga picada + 1 pan integral (50g) + ensalada',392,52,6,32,'130g pechuga picada + 2 panes integrales (100g) + ensalada',418,33,6,58,0],
['a','Bacalao fresco al horno con boniato','Sugerencia: hornea el bacalao con el boniato en rodajas y el AOVE a 190 °C unos 20 min.','250g bacalao fresco + 150g boniato (crudo) + 10g AOVE',425,45,11,37,'150g bacalao fresco + 300g boniato (crudo) + 10g AOVE',460,27,11,68,0],
['a','Wok de calamar y sepia con fideos de arroz','Sugerencia: saltea el calamar y la sepia en wok con verduras y un chorrito de soja. Mezcla con los fideos de arroz hidratados.','220g calamar/sepia limpia + 40g fideos de arroz (secos)',380,40,3,32,'140g calamar/sepia limpia + 85g fideos de arroz (secos)',420,26,3,68,0],
['a','Emperador a la plancha con patata','Sugerencia: haz el emperador a la plancha y acompáñalo con la patata cocida o asada y el AOVE.','220g emperador/pez espada + 160g patata (cruda) + 10g AOVE',528,46,25,28,'140g emperador/pez espada + 310g patata (cruda) + 10g AOVE',529,34,19,54,3],
['a','Tacos de bonito fresco con quinoa','Sugerencia: marca los tacos de bonito por fuera dejando el centro rosado. Sirve con la quinoa cocida y el AOVE.','200g bonito fresco + 40g quinoa (seca) + 10g AOVE',460,48,18,26,'130g bonito fresco + 80g quinoa (seca) + 10g AOVE',490,31,14,54,0],
['s','Merienda de Ana: queso fresco con nueces','Sugerencia: mezcla el queso batido con las nueces troceadas.','200g queso fresco batido 0% + 25g nueces peladas',230,20,13,8,'',0,0,0,0,1],
['s','Merienda de Elena: tostadas, yogur y crema de cacahuete','Sugerencia: tuesta el pan, úntalo con la mermelada (o el plátano) y la crema de cacahuete, y acompáñalo con el yogur.','',0,0,0,0,'2 tostadas de pan integral (60g) + 15g mermelada sin azúcar (o plátano) + 150g yogur 0% + 15g crema de cacahuete',350,20,10,45,2],
['c','Puré modular ligero + proteína a la plancha','Hierve calabacín, puerro, calabaza y coliflor. Tritura con 100 g de queso fresco batido 0% (sin patata en la olla). Sirve la crema y acompaña con la proteína a la plancha. Elena añade la patata cocida y chafada en su plato.','250g puré base + 220g sepia/pollo/pescado + 10g AOVE',410,44,12,32,'250g puré base + 140g sepia/pollo/pescado + 160g patata (cruda) + 10g AOVE',480,31,12,62,0],
['c','Tortilla de atún al natural con tostada','Sugerencia: bate los huevos y las claras con el atún escurrido, cuaja la tortilla en sartén y sirve con el pan tostado.','2 huevos + 100g claras + 120g atún al natural + 30g pan integral',387,56,12,14,'2 huevos + 60g atún al natural + 80g pan integral',400,33,12,40,0],

function parseLab(lines){const L=lines.map(lc),found={};MKS.forEach(m=>{const re=new RegExp('(?:^|[^a-z])(?:'+m.re+')(?![a-z])(?:[ ]*[(][^)]*[)])?[^0-9<>]{0,45}?([<>]?)[ ]*([0-9]+(?:[.,][0-9]+)?)');for(let i=0;i<L.length;i++){const t=re.exec(L[i])||re.exec(L[i]+' '+(L[i+1]||''));if(t){let v=parseFloat(t[2].replace(',','.'));if(m.hi&&v>m.hi*30)v/=1000;found[m.id]=v;break}}});

async function impPdf(inp){const file=inp.files[0];inp.value='';if(!file)return;const sh=t=>md.innerHTML=`<div class="modal"><div class="sheet"><h3>Analítica</h3><p class="empty" style="font-style:normal">${t}</p><button class="btn g" style="width:100%" onclick="closeM()">Cerrar</button></div></div>`;sh('Leyendo el PDF… (se procesa en tu móvil, no se envía a ningún servidor)');

const r=parseLab(lines),ids=Object.keys(r.found);if(!ids.length){sh('No he podido leer valores en este PDF. Puede ser un documento escaneado (imagen) o un formato distinto. Añade los valores a mano con «+ Añadir valor».');return}

async function cRep(k,id){const r=prompt('¿Por qué quieres reportarlo? (opcional)');if(r===null)return;try{await sb('reports',{m:'POST',b:{kind:k,target_id:id,reason:r.slice(0,300)}});alert('Gracias, lo revisaremos.')}catch(e){alert(tr(e.message))}}

function openShare(){const L=S.r.filter(r=>r.u===S.p);md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Compartir receta</h3><label>Rellenar desde una de mis recetas (opcional)</label><select id="sf0" onchange="shFill(this.value)"><option value="">—</option>${L.map(r=>`<option value="${r.id}">${esc(r.n)}</option>`).join('')}</select><label>Título</label><input id="sft" maxlength="80"><label>Comida</label><select id="sfm">${['desayuno','almuerzo','cena','snack','otro'].map(x=>`<option>${x}</option>`).join('')}</select><label>Ingredientes (uno por línea)</label><textarea id="sfi" maxlength="1500"></textarea><label>Elaboración</label><textarea id="sfs" maxlength="3000"></textarea><div class="row"><div><label>Kcal</label><input id="sfk" type="number"></div><div><label>Prot (g)</label><input id="sfp" type="number"></div></div><div class="row"><div><label>Grasa (g)</label><input id="sfg" type="number"></div><div><label>Carbs (g)</label><input id="sfc" type="number"></div></div><p class="empty">Comparte solo recetas tuyas o con permiso de su autora. No incluyas datos personales.</p><div class="row"><button class="btn g" onclick="closeM()">Cancelar</button><button class="btn" onclick="shSave()">Publicar</button></div></div></div>`}
function shFill(id){const r=S.r.find(x=>x.id==id);if(!r)return;sft.value=r.n;sfm.value=r.t;sfi.value=r.x.split('+').map(x=>x.trim()).join('\n');sfs.value=r.e||'';sfk.value=r.k;sfp.value=r.p;sfg.value=r.g;sfc.value=r.c}
async function shSave(){const t=sft.value.trim(),i=sfi.value.trim();if(t.length<3||i.length<3){alert('Pon un título y los ingredientes');return}const n=x=>x.value===''?null:Math.round(+x.value);try{await sb('shared_recipes',{m:'POST',b:{title:t,meal:sfm.value,ingredients:i,steps:sfs.value.trim()||null,kcal:n(sfk),protein:n(sfp),fat:n(sfg),carbs:n(sfc)}});closeM();cm.sub='rec';cm.ld=0;render()}catch(e){alert(tr(e.message))}}
function render(){applyTh();
dt.textContent=pd(date).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
pf.innerHTML=Object.keys(S.g).map(n=>`<button class="chip ${n===S.p?'on':''}" onclick="S.p='${n}';save();render()">${n}</button>`).join('');
m.innerHTML={hoy,comidas,menu,entreno:wk,cuerpo,ciclo,comunidad}[tab]();
const cu=TABS.find(t=>t[0]===tab)||TABS[0];nv.innerHTML=(navOpen?`<div class="nvo" onclick="navOpen=false;render()"></div><div class="nvm">${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`:'')+`<button class="nvb" onclick="navOpen=!navOpen;render()"><span>${cu[1]}</span>${cu[2]}<i>${navOpen?'▾':'▴'}</i></button>`}
pv.onclick=()=>shift(-1);nx.onclick=()=>shift(1);render();
</script></body></html>
