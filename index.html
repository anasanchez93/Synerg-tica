function mkRec(){const o=[],T={d:'desayuno',a:'almuerzo',c:'cena',s:'snack'};RG.forEach((g,i)=>{[['Ana',3],['Elena',8]].forEach(([u,j],q)=>{if(!g[j])return;o.push({id:i*2+q+1,u,t:T[g[0]],n:g[1],e:g[2],x:g[j],k:g[j+1],p:g[j+2],g:g[j+3],c:g[j+4],es:(g[13]&(q?2:1))?1:0})})});return o}

function bar(l,v,max,col){return`<div>${l}<span>${Math.round(v)}g</span></div><div class="bar"><i style="width:${Math.min(v/max*100,100)}%;background:${col}"></i></div>`}

${d.r?'<div class="card" style="border-color:var(--rose)">🧬 Período registrado hoy</div>':''}`}

function cuerpo(){const d=D(),g=S.g[S.p];return`<div class="card"><h3>Calorías quemadas</h3><label>🔥 Reloj / actividad (kcal)</label><input type="number" inputmode="numeric" value="${d.b}" onchange="D().b=+this.value||0;save();render()"></div>
<div class="card"><h3>Calidad del sueño</h3><div style="text-align:center">${ring(d.s,'var(--amb)',110,10,d.s+'%','recuperación')}</div><label>Ajusta el porcentaje</label><input type="range" min="0" max="100" value="${d.s}" onchange="D().s=+this.value;save();render()"></div>
<div class="card"><h3>Objetivos diarios</h3><div class="row"><div><label>Meta kcal</label><input type="number" value="${g.k}" onchange="S.g[S.p].k=+this.value||2000;save();render()"></div><div><label>Meta agua (ml)</label><input type="number" value="${g.w}" onchange="S.g[S.p].w=+this.value||2500;save();render()"></div></div></div>
<div class="card"><h3>Apple Watch · importar de Atajos</h3><button class="btn" style="width:100%" onclick="imp()">📥 Importar datos del portapapeles</button><p class="empty">Ejecuta tu atajo y pulsa aquí. Se aplica al día ${fmt(date)}.</p>${d.sl?`<div class="pre"><span>Dormido</span><b>${Math.floor(d.sl/60)} h ${d.sl%60} min</b></div>`:''}</div>${d.aw&&d.aw.length?`<div class="card"><h3>Actividad del Watch</h3>${d.aw.map(a=>`<div class="it"><div>${a[0]}<small>${a[1]} min · ${a[2]} kcal</small></div></div>`).join('')}</div>`:''}
${S.fo&&S.fo.length?`<div class="card"><h3>Mis alimentos (por 100 g)</h3>${S.fo.map((f,i)=>`<div class="it"><div>${esc(f.n)}<small>${r0(f.k)} kcal · P ${f.p} G ${f.g} C ${f.c}</small></div><button onclick="delFo(${i})">✕</button></div>`).join('')}</div>`:''}

function ciclo(){const c=C(),y=cal.getFullYear(),mo=cal.getMonth(),n=new Date(y,mo+1,0).getDate();let off=(new Date(y,mo,1).getDay()+6)%7,h='';

const st=starts(),last=st[st.length-1];let nx='—';if(last){const x=pd(last);x.setDate(x.getDate()+28);nx=ymd(x)}

function setEt(v){S.st=S.st||{};S.st[S.p]=v;save();render()}
function setFur(v){S.pg=S.pg||{};S.pg[S.p]=v;save();render()}
function etCard(){return`<div class="card"><h3>Registro biológico</h3><div class="chips">${[['ciclo','Ciclo menstrual'],['embarazo','Embarazo'],['menopausia','Menopausia']].map(x=>`<button class="chip ${ST()===x[0]?'on':''}" onclick="setEt('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function sc(n,c){return`<button class="chip ${c.s.includes(n)?'on':''}" onclick="tgS(${AL.indexOf(n)})">${n}</button>`}
function gest(){const fur=(S.pg&&S.pg[S.p])||'';let t='';if(fur){const dd=Math.round((pd(date)-pd(fur))/864e5);if(dd>=0&&dd<=300){const f=pd(fur);f.setDate(f.getDate()+280);t=`<div class="pre"><span>Gestación</span><b>Semana ${Math.floor(dd/7)}+${dd%7}</b></div><div class="pre"><span>Fecha prevista de parto</span><b>${fmt(ymd(f))}</b></div>`}}
return`<label>Fecha de última regla (FUR)</label><input type="date" value="${fur}" onchange="setFur(this.value)">${t}`}
function regCard(c){const e=ST(),chip=(a,f,fn)=>a.map((n,i)=>`<button class="chip ${f(i)?'on':''}" onclick="${fn}(${i})">${n}</button>`).join('');
let h=`<div class="card"><h3>Registro del día · ${fmt(date)}</h3>${e!=='embarazo'?`<button class="btn ${D().r?'r':''}" style="width:100%" onclick="tg(date)">${D().r?'✓ Regla registrada':'🧬 Marcar regla / sangrado'}</button>`:''}<label>Sangrado</label><div class="chips">${chip(FL,i=>c.f===i,'setF')}</div><label>Flujo vaginal</label><div class="chips">${chip(MU,i=>c.m===i,'setM')}</div><label>Temperatura corporal (°C)</label><input type="number" inputmode="decimal" step="0.1" value="${c.t||''}" placeholder="Ej. 36.6" onchange="C().t=this.value;save();render()">${+c.t>=37.5?'<p class="empty" style="color:var(--rose)">Temperatura elevada</p>':''}<label>Síntomas</label><div class="chips">${SY.map(n=>sc(n,c)).join('')}</div>`;

return `<div class="card"><div class="mh"><b style="text-transform:none">${e.x}</b><button class="ib" style="width:28px;height:28px" onclick="delEx(${i})">✕</button></div>${e.p?`<div class="empty" style="margin-top:0">Objetivo: ${e.p}</div>`:''}${ls?`<div class="empty" style="margin-top:0">Última vez: ${ls.map(s=>s.r+'×'+s.k+' kg').join(' · ')}</div>`:''}${e.s.map((s,j)=>`<div class="it"><div>Serie ${j+1}</div><div><b>${s.r}</b> reps × <b>${s.k}</b> kg <button onclick="delSet(${i},${j})">✕</button></div></div>`).join('')}<div class="row" style="align-items:end;margin-top:8px"><div><label>Reps</label><input id="wr${i}" type="number" inputmode="numeric" value="${lr}"></div><div><label>Kg</label><input id="wk${i}" type="number" inputmode="decimal" step="0.5" value="${lk}"></div><button class="btn" style="flex:0 0 56px" onclick="addSet(${i})">+</button></div></div>`}).join('')+(w.length?'':'<div class="card"><div class="empty">Añade un ejercicio o carga una rutina para empezar.</div></div>')}
function addSet(i){const r=+document.getElementById('wr'+i).value,k=+document.getElementById('wk'+i).value||0;if(!r)return;D().wo[i].s.push({r,k});save();render()}
function delSet(i,j){D().wo[i].s.splice(j,1);save();render()}
function delEx(i){D().wo.splice(i,1);save();render()}
let exT='';
function openEx(){exT='';md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Elegir ejercicio</h3><input id="wq" placeholder="Buscar…" oninput="exList()"><div class="chips" style="margin:10px 0"><button class="chip on" onclick="exT='';exList(this)">Todos</button>${Object.keys(TN).map(t=>`<button class="chip" onclick="exT='${t}';exList(this)">${TN[t]}</button>`).join('')}</div><div id="el"></div><button class="add" onclick="newEx()">+ Crear ejercicio propio</button><button class="btn g" style="width:100%;margin-top:8px" onclick="closeM()">Cerrar</button></div></div>`;exList()}
function exList(b){if(b){b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on')}const q=wq.value.toLowerCase();el.innerHTML=allEx().filter(e=>(!exT||e.t===exT)&&e.n.toLowerCase().includes(q)).map(e=>`<div class="it" style="cursor:pointer" data-n="${e.n.replace(/"/g,'&quot;')}" onclick="addEx(this.dataset.n)"><div>${e.n}<small>${TN[e.t]}</small></div><span style="color:var(--lime);font-weight:800">+</span></div>`).join('')||'<div class="empty">Sin resultados</div>'}
function addEx(n){(D().wo||(D().wo=[])).push({x:n,s:[]});save();closeM();render()}
function newEx(){md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Nuevo ejercicio</h3><label>Nombre</label><input id="xn"><label>Tipo</label><select id="xt">${Object.keys(TN).map(t=>`<option value="${t}">${TN[t]}</option>`).join('')}</select><div class="row" style="margin-top:14px"><button class="btn g" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveEx()">Guardar y añadir</button></div></div></div>`}
function saveEx(){const n=xn.value.trim();if(!n)return;S.ex.push({n,t:xt.value});addEx(n)}
function openRo(){const w=D().wo||[];md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Rutinas · toca una para cargarla</h3>${S.ro.map(r=>`<div class="it"><div style="flex:1;cursor:pointer" onclick="loadRo(${r.id})">${r.n}<small>${r.e.map(x=>x[0]+' '+x[1]+'×'+x[2]).join(' · ')}</small></div><button onclick="delRo(${r.id})">✕</button></div>`).join('')}<button class="add" onclick="newRo()">+ Crear rutina</button>${w.length?'<button class="add" onclick="saveToday()">💾 Guardar el entreno de hoy como rutina</button>':''}<button class="btn g" style="width:100%;margin-top:8px" onclick="closeM()">Cerrar</button></div></div>`}
function loadRo(id){const r=S.ro.find(x=>x.id===id),w=D().wo||(D().wo=[]);r.e.forEach(x=>w.push({x:x[0],p:x[1]+'×'+x[2],s:[]}));save();closeM();render()}
function delRo(id){S.ro=S.ro.filter(r=>r.id!==id);save();openRo()}
function saveToday(){const n=prompt('Nombre de la rutina');if(!n)return;S.ro.push({id:Date.now(),n,e:D().wo.map(e=>[e.x,e.s.length||3,e.s.length?e.s[0].r:10])});save();openRo()}
function newRo(){let l='';for(const t in TN){l+=`<h3 style="margin:14px 0 4px">${TN[t]}</h3>`+allEx().filter(e=>e.t===t).map(e=>`<label class="ck"><input type="checkbox" class="ro" value="${e.n.replace(/"/g,'&quot;')}">${e.n}</label>`).join('')}
md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Nueva rutina</h3><label>Nombre</label><input id="ron"><div class="row"><div><label>Series</label><input id="ros" type="number" value="3"></div><div><label>Reps</label><input id="ror" type="number" value="10"></div></div><label>Ejercicios (en el orden en que los marques)</label><div style="max-height:36vh;overflow:auto">${l}</div><div class="row" style="margin-top:14px"><button class="btn g" onclick="openRo()">Cancelar</button><button class="btn" onclick="saveRo()">Guardar</button></div></div></div>`}
function saveRo(){const n=ron.value.trim(),v=[...document.querySelectorAll('.ro:checked')].map(x=>x.value);if(!n||!v.length)return;S.ro.push({id:Date.now(),n,e:v.map(x=>[x,+ros.value||3,+ror.value||10])});save();openRo()}
function dm(v){v=String(v||'').toLowerCase();const h=v.match(/(\d+(?:[.,]\d+)?)\s*h/),mi=v.match(/(\d+(?:[.,]\d+)?)\s*min/),sg=v.match(/(\d+(?:[.,]\d+)?)\s*s(?:eg)?\b/);if(!h&&!mi&&!sg)return pn(v);return(h?pn(h[1])*60:0)+(mi?pn(mi[1]):0)+(sg?pn(sg[1])/60:0)}
function pn(v){v=String(v||'').replace(/\s/g,'');if(v.includes('.')&&v.includes(','))v=v.replace(/\./g,'');return parseFloat(v.replace(',','.'))||0}
function imp(){const go=t=>{try{ap(t)}catch(e){alert('No he entendido los datos del portapapeles. Ejecuta el atajo y vuelve a intentarlo.')}},ask=()=>{const t=prompt('Pega aquí los datos del atajo');if(t)go(t)};
if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(go).catch(ask);else ask()}
function ap(t){const d=D(),aw=[];let n=0;t.split(/\r?\n/).forEach(l=>{const i=l.indexOf('=');if(i<0)return;const k=l.slice(0,i).trim().toLowerCase(),v=l.slice(i+1).trim();
if(k==='kcal'){d.b=r0(pn(v));n++}
else if(k==='sueno'){let m=dm(v);if(m>1440)m/=60;else if(m<=24)m*=60;d.sl=r0(m);d.s=Math.min(100,r0(m/480*100));n++}
else if(k==='act'){const q=v.split('|');aw.push([q[0]||'Actividad',r0(dm(q[1])),r0(pn(q[2]))]);n++}});
if(!n)throw 0;d.aw=aw;save();render();alert('Importado ✓')}
function openRec(){const TT={d:'Desayuno',a:'Almuerzos',s:'Meriendas',c:'Cenas'},TK={d:'desayuno',a:'almuerzo',s:'snack',c:'cena'};let h='';
for(const t of['d','a','s','c']){const L=S.r.filter(r=>r.u===S.p&&r.t===TK[t]&&r.e);if(!L.length)continue;h+=`<h3 style="margin:16px 0 8px">${TT[t]}</h3>`+L.map((r,i)=>`<details class="it" style="display:block"><summary style="cursor:pointer"><b>${t==='a'||t==='c'?'Opción '+(i+1)+' · ':''}${r.n}</b></summary><p class="empty" style="font-style:normal;line-height:1.5;margin:8px 0">${r.e}</p><small>Tu plato: ${r.x}</small><small style="color:var(--lime)">${r.es?'≈ ':''}${r.k} kcal · P ${r.p} G ${r.g} C ${r.c}</small></details>`).join('')}
md.innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Recetario de ${S.p}</h3>${h}<button class="btn g" style="width:100%;margin-top:12px" onclick="closeM()">Cerrar</button></div></div>`}

dt.textContent=pd(date).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});

nv.innerHTML=[['hoy','🏠','Inicio'],['comidas','🍽','Comidas'],['menu','📋','Menú'],['entreno','💪','Entreno'],['cuerpo','⚡','Cuerpo'],['ciclo','🧬','Biológico']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('')}
pv.onclick=()=>shift(-1);nx.onclick=()=>shift(1);render();
