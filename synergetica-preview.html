function loadPdfJs(){return new Promise((ok,ko)=>{if(window.pdfjsLib)return ok();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok()};sc.onerror=()=>ko(new Error('offline'));document.head.appendChild(sc)})}
function parseLab(lines){const L=lines.map(lc),found={};MKS.forEach(m=>{const re=new RegExp('(?:^|[^a-z])(?:'+m.re+')(?![a-z])(?:[ ]*[(][^)]*[)])?[^0-9<>]{0,45}?([<>]?)[ ]*([0-9]+(?:[.,][0-9]+)?)');for(let i=0;i<L.length;i++){const t=re.exec(L[i])||re.exec(L[i]+' '+(L[i+1]||''));if(t){let v=parseFloat(t[2].replace(',','.'));if(m.hi&&v>m.hi*30)v/=1000;found[m.id]=v;break}}});
const dm=/fecha[^0-9]{0,25}([0-9]{1,2})[/.-]([0-9]{1,2})[/.-]([0-9]{2,4})/.exec(L.join(' '));let f=ymd(new Date());if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];f=y+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0')}return{found,f}}
async function impPdf(inp){const file=inp.files[0];inp.value='';if(!file)return;const sh=t=>md.innerHTML=`<div class="modal"><div class="sheet"><h3>Analítica</h3><p class="empty" style="font-style:normal">${t}</p><button class="btn g" style="width:100%" onclick="closeM()">Cerrar</button></div></div>`;sh('Leyendo el PDF… (se procesa en tu móvil, no se envía a ningún servidor)');
try{await loadPdfJs();const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,lines=[];for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent(),rows={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]/4);(rows[y]=rows[y]||[]).push([it.transform[4],it.str])});Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ')))}
const r=parseLab(lines),ids=Object.keys(r.found);if(!ids.length){sh('No he podido leer valores en este PDF. Puede ser un documento escaneado (imagen) o un formato distinto. Añade los valores a mano con «+ Añadir valor».');return}
md.innerHTML=`<div class="modal"><div class="sheet"><h3>Revisa los valores detectados</h3><label>Fecha de la analítica</label><input id="lbd" type="date" value="${r.f}">${MKS.filter(m=>r.found[m.id]!=null).map(m=>`<div class="row" style="align-items:center;margin-top:8px"><div style="flex:2;font-size:13px">${m.n}<small style="display:block;color:var(--mu)">${m.u}</small></div><input class="lbi" data-id="${m.id}" type="number" step="any" value="${r.found[m.id]}"></div>`).join('')}<p class="empty">Detectados ${ids.length} de ${MKS.length} marcadores. Comprueba que los números coinciden con tu informe; vacía una casilla para no guardarla.</p><div class="row"><button class="btn g" onclick="closeM()">Cancelar</button><button class="btn" onclick="lbOk()">Guardar</button></div></div></div>`}catch(e){sh('No he podido abrir el PDF. Comprueba que tienes conexión (la primera vez se descarga el lector) o añade los valores a mano.')}}

function shrink(f,max=1000,q=.72){return new Promise((ok,ko)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('Imagen no válida')),'image/jpeg',q)};i.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('No se pudo leer la imagen'))};i.src=u})}

function migrate(L,f,t){const n=init();n.p=t;n.g[t]=Object.assign({k:2000,w:2500,p:150,g:65,c:250},L.g&&L.g[f]);Object.keys(L.d||{}).forEach(k=>{if(k.startsWith(f+'|'))n.d[t+'|'+k.slice(f.length+1)]=L.d[k]});const mv=a=>(a||[]).filter(x=>x.u===f).map(x=>({...x,u:t}));n.r=mv(L.r);n.md=mv(L.md);n.lb=mv(L.lb);if(L.ro)n.ro=L.ro;n.ex=L.ex||[];n.fo=L.fo||[];n.st={[t]:(L.st||{})[f]||'ciclo'};n.pg={[t]:(L.pg||{})[f]||''};['th','ac','sc'].forEach(k=>{if(L[k]!=null)n[k]=L[k]});return n}

utløpt"], "La contraseña es demasiado corta (mínimo 8 caracteres)": ["The password is too short (minimum 8 characters)", "Passordet er for kort (minst 8 tegn)"], "Contraseña demasiado débil: añade letras y números": ["Password too weak: add letters and numbers", "Passordet er for svakt: legg til bokstaver og tall"], "La nueva contraseña debe ser distinta de la anterior": ["The new password must differ from the old one", "Det nye passordet må være forskjellig fra det gamle"], "Faltan las tablas en Supabase: ejecuta el archivo SQL": ["Tables are missing in Supabase: run the SQL file", "Tabeller mangler i Supabase: kjør SQL-filen"], "Demasiados intentos, espera un poco": ["Too many attempts, wait a moment", "For mange forsøk, vent litt"], "Inicia sesión": ["Sign in", "Logg inn"], "Sesión caducada: vuelve a entrar": ["Session expired: sign in again", "Økten er utløpt: logg inn på nytt"], "Confirma tu email": ["Confirm your email", "Bekreft e-posten din"], "Recuperar contraseña": ["Recover password", "Gjenopprett passord"], "Nueva contraseña (mín. 8)": ["New password (min. 8)", "Nytt passord (min. 8)"], "Crea tu cuenta": ["Create your account", "Opprett kontoen din"], "Escribe tu email y contraseña": ["Enter your email and password", "Skriv inn e-post og passord"], "Elige un nombre visible (mín. 2 letras)": ["Choose a display name (min. 2 letters)", "Velg et visningsnavn (min. 2 bokstaver)"], "Indica si eres mujer, hombre o prefieres no indicarlo": ["Say whether you're female, male or prefer not to say", "Oppgi om du er kvinne, mann eller foretrekker å ikke si det"], "Escribe tu email": ["Enter your email", "Skriv inn e-posten din"], "La contraseña debe tener al menos 8 caracteres": ["The password must have at least 8 characters", "Passordet må ha minst 8 tegn"], "Debes confirmar que tienes 18 años o más y aceptar las normas": ["You must confirm you are 18 or older and accept the rules", "Du må bekrefte at du er 18 år eller eldre og godta reglene"], "Escribe el código": ["Enter the code", "Skriv inn koden"], "Imagen no válida": ["Invalid image", "Ugyldig bilde"], "No se pudo leer la imagen": ["Couldn't read the image", "Kunne ikke lese bildet"], "Inicia sesión para subir fotos": ["Sign in to upload photos", "Logg inn for å laste opp bilder"], "Clave copiada": ["Key copied", "Nøkkel kopiert"], "Dirección copiada": ["Address copied", "Adresse kopiert"], "Idioma": ["Language", "Språk"], "Se calcula con la fórmula PhenoAge (Levine 2018) a partir de 9 marcadores de tus analíticas: albúmina, creatinina, glucosa, PCR, % de linfocitos, VCM, RDW, fosfatasa alcalina y leucocitos. Si indicas peso y altura, se suma un pequeño ajuste por IMC (0 con IMC normal; +1 con bajo peso o sobrepeso, +2 con obesidad I y +3 con obesidad II o más); ese ajuste es una regla sencilla de Synergética, no está validado. Si registras grasa, masa muscular y agua corporal (por ejemplo de tu báscula), también se ajusta: +1 con grasa por encima del rango (+2 si pasa 8 puntos), +1 con músculo o agua por debajo y −1 con mucho músculo; el total va de −1 a +3 años y tampoco está validado. Colores: azul claro = más joven que tu edad real, verde = en línea, amarillo a rojo = mayor. Es orientativo y no un diagnóstico; no equivale a la «edad metabólica» de las básculas.": ["It is calculated with the PhenoAge formula (Levine 2018) from 9 markers in your blood tests: albumin, creatinine, glucose, CRP, lymphocyte %, MCV, RDW, alkaline phosphatase and white cells. If you enter weight and height, a small BMI adjustment is added (0 with normal BMI; +1 if underweight or overweight, +2 with obesity I and +3 with obesity II or more); this adjustment is a simple Synergética rule and is not validated. If you log body fat, muscle mass and body water (e.g. from your scale) it is also adjusted: +1 with fat above range (+2 if over by 8 points), +1 with muscle or water below range and −1 with a lot of muscle; the total ranges from −1 to +3 years and is not validated either. Colours: light blue = younger than your real age, green = in line, yellow to red = older. It is a guide, not a diagnosis; it is not the same as the «metabolic age» shown by scales.", "Beregnes med PhenoAge-formelen (Levine 2018) ut fra 9 markører i blodprøvene dine: albumin, kreatinin, glukose, CRP, lymfocytt-%, MCV, RDW, alkalisk fosfatase og hvite blodceller. Hvis du oppgir vekt og høyde, legges det til en liten BMI-justering (0 ved normal BMI; +1 ved undervekt eller overvekt, +2 ved fedme I og +3 ved fedme II eller mer); denne justeringen er en enkel Synergética-regel og er ikke validert. Hvis du registrerer kroppsfett, muskelmasse og kroppsvann (f.eks. fra vekten din), justeres den også: +1 med fett over området (+2 hvis over med 8 poeng), +1 med muskel eller vann under og −1 med mye muskel; totalen går fra −1 til +3 år og er heller ikke validert. Farger: lyseblå = yngre enn din faktiske alder, grønn = på linje, gul til rød = eldre. Veiledende, ikke en diagnose; tilsvarer ikke «metabolsk alder» fra vekter."], "IMC = peso (kg) ÷ altura (m)². Menos de 18,5 bajo peso · 18,5–24,9 normal · 25–29,9 sobrepeso · 30 o más obesidad. Es un índice orientativo: no distingue músculo de grasa. El peso también cuenta para la edad metabólica (pestaña Cuerpo).": ["BMI = weight (kg) ÷ height (m)². Under 18.5 underweight · 18.5–24.9 normal · 25–29.9 overweight · 30 or more obesity. It's a guide: it doesn't tell muscle from fat. Weight also counts toward metabolic age (Body tab).", "BMI = vekt (kg) ÷ høyde (m)². Under 18,5 undervekt · 18,5–24,9 normal · 25–29,9 overvekt · 30 eller mer fedme. Veiledende: skiller ikke muskler fra fett. Vekten teller også med i metabolsk alder (Kropp-fanen)."], "Estimación orientativa, no un diagnóstico. Compara tu VFC y tu FC en reposo de hoy con tu media de los últimos días (una VFC más baja y una FC más alta suelen indicar más estrés o menos recuperación) y lo suma a cómo te sientes. Necesita al menos 4 días de VFC y de FC (se rellenan solos con el atajo del Apple Watch); mientras tanto solo cuenta cómo te sientes.": ["Rough estimate, not a diagnosis. It compares today's HRV and resting HR with your average of recent days (lower HRV and higher HR usually mean more stress or less recovery) and adds how you feel. It needs at least 4 days of HRV and HR (filled in automatically by the Apple Watch shortcut); until then only how you feel counts.", "Veiledende estimat, ikke en diagnose. Sammenligner dagens HRV og hvilepuls med snittet de siste dagene (lavere HRV og høyere puls betyr ofte mer stress eller dårligere restitusjon) og legger til hvordan du føler deg. Trenger minst 4 dager med HRV og puls (fylles ut automatisk med Apple Watch-snarveien); inntil da teller bare hvordan du føler deg."], "Sugerencias": ["Suggestions", "Forslag"], "IMC": ["BMI", "KMI"], "VFC": ["HRV", "HRV"], "FC": ["HR", "Puls"], "PA": ["BP", "BT"], "FR": ["RR", "RF"], "PCR": ["CRP", "CRP"], "Objetivo": ["Target", "Mål"], "Lima": ["Lime", "Lime"], "Cielo": ["Sky", "Himmel"], "Rosa": ["Pink", "Rosa"], "Violeta": ["Violet", "Fiolett"], "Naranja": ["Orange", "Oransje"], "Turquesa": ["Turquoise", "Turkis"], "⚑ Reportar datos incorrectos": ["⚑ Report incorrect data", "⚑ Rapporter feil data"], "Compartir con todos (solo nombre y valores)": ["Share with everyone (name and values only)", "Del med alle (bare navn og verdier)"], "Datos": ["Data", "Data"], "+ Serie": ["+ Set", "+ Sett"], "Equipamiento": ["Equipment", "Utstyr"], "Músculos primarios": ["Primary muscles", "Primære muskler"], "Músculos secundarios": ["Secondary muscles", "Sekundære muskler"], "Acerca de": ["About", "Om"], "Guía": ["Guide", "Guide"], "Cómo registrar": ["How to log", "Slik logger du"], "Toca el círculo de cada serie para marcarla como hecha. Cambia los kg y las repeticiones tocando las casillas. En ejercicios con peso corporal deja los kg vacíos.": ["Tap the circle on each set to mark it done. Change kg and reps by tapping the boxes. For bodyweight exercises leave kg empty.", "Trykk på sirkele
